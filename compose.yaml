services:
  geo:
    build: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:4387:4387"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - geography:/data
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  geography:
