<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact review · Migs Geo</title><link rel="stylesheet" href="/review.css"><script type="module" src="/fact-review.js"></script></head>
<body><main><a href="/settings">← Settings</a><h1>Fact review</h1>
<p>Choose a fact for the answer side. Decisions and comments save on this computer. Ask to publish when you’re ready.</p>
<div class="controls"><label>Find a place<input id="search" type="search"></label>
<label>Places<select id="scope"><option value="studying">Current study settings</option><option value="all">Whole collection</option></select></label>
<a href="/api/fact-review" download="fact-decisions.json">Download review JSON</a></div>
<p id="summary" role="status">Loading…</p>
<section><h2>Choose a fact</h2><div id="pending"></div></section>
<details><summary id="research-heading">Awaiting research</summary><div id="research"></div></details>
<section><h2>Already chosen</h2><div id="chosen"></div></section>
</main></body></html>
