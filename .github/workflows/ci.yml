name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Save production frontend
        if: matrix.node == 26
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: dist/
          retention-days: 7
  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag migs-geo:ci .
      - name: Check health, SQLite, persistence, and backups
        run: node scripts/container-smoke.mjs migs-geo:ci
      - name: Export image for OS vulnerability scanning
        run: docker save migs-geo:ci --output "${{ runner.temp }}/migs-geo.tar"
      - name: Check for fixable high and critical OS advisories
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --volume "${{ runner.temp }}/migs-geo.tar:/image.tar:ro" \
            ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
